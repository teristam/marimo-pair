[project]
name = "notebooks"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Teris Tam", email = "teristam@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "marimo>=0.25.2",
    "scikit-learn>=1.9.1",
